<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");

images.forEach(img => {
  img.addEventListener("click", () => {
    lightbox.style.display = "flex";
    lightboxImg.src = img.src;
  });
});

closeBtn.onclick = () => {
  lightbox.style.display = "none";
};
</script>


<script>
let galleryIndex = 0;

const gallerySlides = document.querySelectorAll(".gallery-slide");
const galleryTrack = document.querySelector(".gallery-track");

function updateGallerySlide() {
  galleryTrack.style.transform = `translateX(-${galleryIndex * 100}%)`;
}

function nextGallerySlide() {
  galleryIndex = (galleryIndex + 1) % gallerySlides.length;
  updateGallerySlide();
}

function prevGallerySlide() {
  galleryIndex = (galleryIndex - 1 + gallerySlides.length) % gallerySlides.length;
  updateGallerySlide();
}

document.querySelector(".gallery-next").onclick = nextGallerySlide;
document.querySelector(".gallery-prev").onclick = prevGallerySlide;

setInterval(nextGallerySlide, 4000);
</script>
